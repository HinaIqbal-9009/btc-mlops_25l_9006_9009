apiVersion: v1
kind: Pod
metadata:
  name: load-generator
spec:
  restartPolicy: Never
  containers:
    - name: load
      image: engrhina/btc-forecast:latest
      imagePullPolicy: IfNotPresent
      command: ["python", "-c"]
      args:
        - |
          import threading, time, requests
          URL = "http://btc-forecast/predict"
          stop = time.time() + 600
          def worker():
              s = requests.Session()
              while time.time() < stop:
                  try:
                      s.post(URL, json={"forecast_days": 14}, timeout=10)
                  except Exception:
                      time.sleep(0.2)
          threads = [threading.Thread(target=worker) for _ in range(30)]
          [t.start() for t in threads]
          [t.join() for t in threads]
