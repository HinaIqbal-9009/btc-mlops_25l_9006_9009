apiVersion: batch/v1
kind: Job
metadata:
  name: btc-bootstrap-model
spec:
  backoffLimit: 3
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: train
          image: engrhina/btc-forecast:latest
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - |
              python -m src.etl_fetch --out /tmp/raw.csv &&
              python -m src.features --raw /tmp/raw.csv --out /tmp/features.csv &&
              python -m src.train_forecast --features /tmp/features.csv --out-dir /app/models
          envFrom:
            - configMapRef:
                name: btc-config
          volumeMounts:
            - name: models
              mountPath: /app/models
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: btc-models-pvc
