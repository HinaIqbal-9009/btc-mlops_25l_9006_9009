# Local integration environment: Flask API + Airflow + Postgres.
#   docker compose up --build -d
#   Airflow UI -> http://localhost:8080  (admin / admin)      API -> http://localhost:5000
x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: docker/airflow.Dockerfile
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__WEBSERVER__SECRET_KEY: btc-dev-secret-key
    PROJECT_ROOT: /opt/airflow/project
    API_RELOAD_URL: http://api:5000/admin/reload
    ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    MAPE_THRESHOLD: "15"
  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/project/src
    - shared-models:/opt/airflow/project/models
    - shared-data:/opt/airflow/project/data
  depends_on:
    postgres:
      condition: service_healthy
    init-perms:
      condition: service_completed_successfully

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10

  # Named volumes are created root-owned; the API (uid 10001) and Airflow (uid 50000) both
  # need to write to them, so open the permissions once (DEV-ONLY compose setup).
  init-perms:
    image: alpine:3.20
    command: sh -c "chmod -R 0777 /models /data"
    volumes:
      - shared-models:/models
      - shared-data:/data

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db migrate &&
        airflow users create --username admin --password admin \
          --firstname Admin --lastname User --role Admin --email admin@example.com

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    image: btc-forecast:local
    environment:
      PORT: "5000"
      MODEL_DIR: /app/models
      MODEL_STAGE: development
      LOG_LEVEL: INFO
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
    ports:
      - "5000:5000"
    volumes:
      - shared-models:/app/models
    depends_on:
      init-perms:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  pg-data:
  shared-models:
  shared-data:
